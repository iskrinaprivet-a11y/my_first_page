name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Позволяет workflow писать в Pages и выпускать OIDC-токен для деплоя.
permissions:
  contents: read
  pages: write
  id-token: write

# Не запускаем новые деплои, пока предыдущий не доехал.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Выложить dist как артефакт Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Задеплоить в GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4